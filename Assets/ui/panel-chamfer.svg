<?xml version="1.0" encoding="UTF-8"?>
<!--
  Generated by code, not drawn by hand or by an image model.

  A chamfered panel frame for 9-slice use via border-image. 64x64 with a 20px slice, so the
  corners stay crisp at any panel size while the edges stretch. This is the shape that neither
  mask gradients nor background gradients could produce: the mask form hid whole elements when
  its stops were pixels, and an angled gradient across a small box renders as a fat triangle
  over one corner rather than a bevel.

  Fill is $void (#12141C). The hairline is a low-alpha white so the frame reads as an edge
  rather than an outline.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <polygon
    points="14,0 64,0 64,50 50,64 0,64 0,14"
    fill="#12141C"
    stroke="#FFFFFF"
    stroke-opacity="0.10"
    stroke-width="2" />
</svg>
